name: Forks and releases watch

# Once a month: scan public forks of thedemons/opentele for new commits,
# check stable Telegram Desktop and Telethon releases, generate a Markdown
# report, open it as a GitHub Issue so it lands in the
# maintainer's notifications.
#
# Doesn't need any secrets — uses the default GITHUB_TOKEN which already has
# `issues: write` on the repository it runs from.
on:
  schedule:
    # 12:00 UTC on the 1st of every month.
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Generate report
        id: report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python scripts/fork_watch.py > /tmp/forks-report.md; then
            :
          else
            echo "Fork scan failed; check the workflow log." >> /tmp/forks-report.md
            echo "has_activity=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Report size: $(wc -l < /tmp/forks-report.md) lines"
          cat /tmp/forks-report.md

      - name: Check official releases
        id: releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release_watch.py >> /tmp/forks-report.md

      - name: Open issue with report
        if: steps.report.outputs.has_activity == 'true' || steps.releases.outputs.has_activity == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/forks-report.md', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            // Ensure label exists (idempotent — ignore "already exists" error).
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'forks-watch',
                color: 'fbca04',
                description: 'Monthly fork activity and official release report',
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Forks and releases watch — ${today}`,
              body: body,
              labels: ['forks-watch'],
            });
