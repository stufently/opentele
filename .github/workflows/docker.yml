name: Docker

# Builds and pushes the opentele-ng container image to GHCR.
#
# Trigger:
#   - push to main → tag `:main` + `:sha-<7>` (rolling dev image)
#   - push of `v<MAJ>.<MIN>.<PAT>(-suffix)?` tag → `:1.2.3`, `:1.2`, `:1`, `:latest`
#
# Image is multi-arch (linux/amd64 + linux/arm64) so it runs on Apple Silicon
# laptops and AWS Graviton hosts unchanged.
on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Dispatched by autotag.yml with --ref v<version>: tags created with the
  # workflow's GITHUB_TOKEN don't fire the `push: tags` trigger themselves.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Third-party actions are pinned by commit SHA (the `vN` tags are mutable):
      # this job holds a GHCR push token, so an upstream tag repoint would be a
      # supply-chain hole. SHAs below were verified against official releases on 2026-10-04.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/opentele-ng
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}},prefix=,value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},prefix=,value=${{ github.ref_name }}
            type=semver,pattern={{major}},prefix=,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build + push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/opentele-ng
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
