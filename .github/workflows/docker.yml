name: Docker

# Builds and pushes the opentele-ng container image to GHCR.
#
# Trigger:
#   - push to main → tag `:main` + `:sha-<7>` (rolling dev image)
#   - push of `v<MAJ>.<MIN>.<PAT>(-suffix)?` tag → `:1.2.3`, `:1.2`, `:1`, `:latest`
#
# Image is multi-arch (linux/amd64 + linux/arm64) so it runs on Apple Silicon
# laptops and AWS Graviton hosts unchanged.
on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Dispatched by autotag.yml with --ref v<version>: tags created with the
  # workflow's GITHUB_TOKEN don't fire the `push: tags` trigger themselves.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Third-party actions are pinned by commit SHA (the `vN` tags are mutable):
      # this job holds a GHCR push token, so an upstream tag repoint would be a
      # supply-chain hole. SHAs below == what `vN` resolved to on 2026-07-25.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/opentele-ng
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}},prefix=,value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},prefix=,value=${{ github.ref_name }}
            type=semver,pattern={{major}},prefix=,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build + push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/opentele-ng
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
