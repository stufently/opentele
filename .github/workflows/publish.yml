name: Publish to PyPI

# Auto-publishes opentele-ng to PyPI when a tag matching `v*` is pushed.
# Uses PyPI Trusted Publishing (OIDC) — no long-lived API token in the repo.
#
# Setup (one-time, in PyPI web UI):
#   https://pypi.org/manage/account/publishing/
#   → Add a pending publisher:
#       PyPI Project Name:  opentele-ng
#       Owner:              stufently
#       Repository name:    opentele
#       Workflow filename:  publish.yml
#       Environment name:   pypi
#       (the GitHub environment "pypi" must allow deployments from tags:
#        "Allow all branches and tags" or a "v*" tag pattern — a main-only
#        deployment branch policy would reject runs on tag refs)
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Dispatched by autotag.yml with --ref v<version>: a tag created with the
  # workflow's GITHUB_TOKEN does not fire the `push: tags` trigger itself.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0

      - name: Install package + test deps
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run full test suite
        # Gate matches ci.yml — see the comment there for why it is 78 and not 80.
        run: pytest --tb=short --ignore=tests/tdata_test.py --cov=opentele --cov-fail-under=78 tests/

  build:
    name: Build sdist + wheel
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build deps
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag matches pyproject version
        run: |
          # Publish only ever runs from a tag ref — a workflow_dispatch on a
          # branch (even one named like v1.2.3) must not reach PyPI.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "ERROR: ref '$GITHUB_REF_NAME' is a $GITHUB_REF_TYPE, not a tag — refusing to publish" >&2
              exit 1
          fi
          PY_VERSION=$(python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          REF=${GITHUB_REF_NAME}
          # Strip leading 'v' and any '-suffix' so v1.2.3-polish matches 1.2.3
          TAG_VERSION=${REF#v}
          TAG_VERSION=${TAG_VERSION%%-*}
          echo "pyproject: $PY_VERSION   tag: $TAG_VERSION   ref: $REF"
          if [ "$PY_VERSION" != "$TAG_VERSION" ]; then
              echo "ERROR: pyproject version ($PY_VERSION) does not match tag ($TAG_VERSION)" >&2
              exit 1
          fi

      - name: Build
        run: python -m build

      - name: twine check
        run: python -m twine check dist/*

      - name: Show artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Upload to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/opentele-ng/
    permissions:
      id-token: write   # OIDC
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Pinned by commit SHA, not by the floating `release/v1` branch: this step
      # holds the OIDC token that can upload to PyPI, so a compromised upstream
      # branch would publish arbitrary code under our project name. Bump
      # deliberately (check the upstream release notes) — Dependabot also PRs it.
      - name: Publish (with PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
