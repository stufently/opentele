[build-system]
# SPDX license + license-files require setuptools>=77 (PEP 639).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentele-ng"
version = "1.4.1"
description = "Modern fork of opentele for Python 3.10–3.14 — no Qt runtime dependency (pure-Python QDataStream replacement). Convert Telegram Desktop tdata to Telethon and Pyrogram sessions; no tdata version gate, block format tracked against current Telegram Desktop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "stufently (fork of thedemons)", email = "stufently@gmail.com" },
]
keywords = [
    "tdata",
    "tdesktop",
    "telegram",
    "telegram-desktop",
    "telethon",
    "opentele",
    "opentele-ng",
    "python-3.13",
    "python-3.14",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    "telethon>=1.36,<2; python_version < '3.14'",
    "telethon>=1.43,<2; python_version >= '3.14'",
    "tgcrypto-pyrofork>=1.2.7",
]

[project.optional-dependencies]
# Pyrogram bridge (opentele.tl.pyrogram_bridge). `pyrofork` is the maintained
# distribution of the `pyrogram` package and matches the tgcrypto-pyrofork we
# already depend on; vanilla `pyrogram` and `kurigram` provide the same import
# name and work too.
pyrogram = [
    "pyrofork>=2.3",
]
test = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-asyncio>=0.21",
    "hypothesis>=6",
    "ruff>=0.5",
    # PyQt6 stays test-only — used as the byte-identity oracle in
    # tests/qdatastream/* against the pure-Python QDataStream replacement.
    "PyQt6>=6.6",
    # Exercises the Pyrogram bridge for real instead of skipping it.
    "pyrofork>=2.3",
]

[project.urls]
Homepage = "https://github.com/stufently/opentele"
Source = "https://github.com/stufently/opentele"
Changelog = "https://github.com/stufently/opentele/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/stufently/opentele/issues"
Documentation = "https://github.com/stufently/opentele#readme"
Security = "https://github.com/stufently/opentele/blob/main/SECURITY.md"

[project.scripts]
opentele-ng = "opentele.__main__:main"

[tool.setuptools]
include-package-data = true
packages = ["opentele", "opentele.td", "opentele.tl"]

[tool.setuptools.package-dir]
opentele = "src"

[tool.setuptools.package-data]
opentele = ["py.typed", "devices.json"]

# Ruff is configured in `.ruff.toml`, NOT here. A `.ruff.toml` next to
# `pyproject.toml` wins outright, so a `[tool.ruff]` table in this file is dead
# config — it silently disagreed with `.ruff.toml` (line-length 100 vs 120, a
# much shorter ignore list) until 1.3.2, which is a trap for anyone tuning lint
# rules. Edit `.ruff.toml`.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
